name: Deploy TimeCraft to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      redistribution_cleared:
        description: Confirm redistribution clearance for bundled dependencies
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.redistribution_cleared && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx --no-install vite build --config scripts/release-vite.config.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .iwsdk/m6-host/timecraft-mr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
