<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>TimeCraft MR</title>
    <style>
      body { background:#101614; color:#f4f1e9; font:16px system-ui,sans-serif; }
      #launcher { position:fixed; z-index:10; left:clamp(16px,4vw,56px); top:clamp(16px,6vh,56px);
        box-sizing:border-box; width:min(390px,calc(100vw - 32px)); padding:26px; border:1px solid #66573d;
        border-radius:18px; background:#161e1c; box-shadow:0 12px 36px #0007; }
      #launcher[hidden] { display:none; }
      #launcher h1 { margin:5px 0 12px; font:normal 38px Georgia,serif; }
      #launcher p { color:#c6ccc7; line-height:1.45; }
      #launcher .eyebrow { color:#e0bb7f; letter-spacing:.18em; font-size:11px; font-weight:700; }
      #launcher button, #launcher select { font:inherit; padding:10px 13px; border-radius:8px; border:1px solid #82704f; }
      #launcher button { display:block; width:100%; margin:8px 0; cursor:pointer; color:#151a17; background:#d8b77f; }
      #launcher button + button { color:#f3f0e7; background:#303d37; }
      #launcher button:disabled { opacity:.52; cursor:default; }
      #launcher select { color:#f3f0e7; background:#303d37; margin-left:6px; }
      #launcher :focus-visible { outline:2px solid #fff; outline-offset:3px; }
      #launch-status { min-height:2.9em; margin-bottom:0; font-size:14px; }
    </style>
  </head>
  <body style="margin: 0">
    <div id="scene-container"></div>
    <main id="launcher">
      <span class="eyebrow">THE WATCHMAKING STUDIO</span>
      <h1>TimeCraft MR</h1>
      <p>Assemble a mechanical watch by hand, then wind it to hear its first tick.</p>
      <button id="launch-mr" disabled>Enter Mixed Reality</button>
      <button id="launch-vr" disabled>Enter Workshop VR</button>
      <label for="graphics">Graphics</label>
      <select id="graphics">
        <option value="auto">Auto</option>
        <option value="performance">Performance</option>
        <option value="quality">Quality</option>
      </select>
      <p id="launch-status" role="status">Loading the studio…</p>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
